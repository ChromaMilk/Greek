<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมเศรษฐี: อารยธรรมกรีก</title>
<style>/* ===== RESET & BASE ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 50%, #0d2044 100%);
    min-height: 100vh; color: #fff; overflow-x: hidden;
  }

  /* ===== DECORATIVE ===== */
  .greek-border {
    border: 3px solid #d4af37;
    border-image: repeating-linear-gradient(90deg,#d4af37 0,#d4af37 10px,transparent 10px,transparent 20px) 3;
  }
  .gold { color: #d4af37; }
  .btn {
    background: linear-gradient(135deg, #d4af37, #b8860b);
    color: #0a1628; border: none; padding: 10px 20px; border-radius: 8px;
    cursor: pointer; font-weight: bold; font-size: 14px; transition: all .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(212,175,55,.5); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: linear-gradient(135deg, #1a3a6b, #0d2044);
    color: #d4af37; border: 2px solid #d4af37;}

  /* ===== SCREENS ===== */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ===== SETUP SCREEN ===== */
  #setupScreen {
    max-width: 600px; margin: 0 auto; padding: 20px; text-align: center;
  }
  .logo { font-size: 3em; margin: 20px 0 5px; }
  .logo-title { font-size: 2em; color: #d4af37; text-shadow: 0 0 20px rgba(212,175,55,.5); margin-bottom: 5px; }
  .logo-sub { color: #9bb3d4; margin-bottom: 30px; }
  .setup-card {
    background: rgba(255,255,255,.05); border: 2px solid #d4af37;
    border-radius: 16px; padding: 25px; margin-bottom: 20px;
  }
  .setup-card h3 { color: #d4af37; margin-bottom: 15px; font-size: 1.1em; }
  .player-count-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .count-btn {
    width: 60px; height: 60px; border-radius: 50%; font-size: 1.5em; font-weight: bold;
    background: rgba(255,255,255,.1); border: 2px solid #4a6fa5; color: #fff;
    cursor: pointer; transition: all .2s;
  }
  .count-btn.selected { background: linear-gradient(135deg,#d4af37,#b8860b); color: #0a1628; border-color: #d4af37; }
  .player-inputs { display: flex; flex-direction: column; gap: 10px; }
  .player-input-row { display: flex; align-items: center; gap: 10px; }
  .player-avatar { font-size: 1.5em; width: 40px; text-align: center; }
  .player-input-row input {
    flex: 1; background: rgba(255,255,255,.1); border: 2px solid #4a6fa5;
    border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 14px;
  }
  .player-input-row input:focus { outline: none; border-color: #d4af37; }

  /* ===== GAME SCREEN ===== */
  #gameScreen { padding: 10px; }
  .game-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 15px; background: rgba(0,0,0,.3);
    border-bottom: 2px solid #d4af37; margin-bottom: 10px;
  }
  .game-title { font-size: 1.1em; color: #d4af37; font-weight: bold; }
  .header-btns { display: flex; gap: 8px; }

  /* ===== BOARD ===== */
  .board-container { max-width: 900px; margin: 0 auto; }
  .board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px; padding: 8px;
    background: rgba(0,0,0,.2); border-radius: 12px;
    border: 2px solid #d4af37;
  }
  .cell {
    background: rgba(26,58,107,.6); border: 1px solid #4a6fa5;
    border-radius: 8px; padding: 4px; min-height: 70px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; position: relative;
    cursor: default; transition: all .2s; font-size: 11px;
  }
  .cell:hover { border-color: #d4af37; }
  .cell.start { background: linear-gradient(135deg,rgba(212,175,55,.3),rgba(184,134,11,.2)); border-color: #d4af37; }
  .cell.question { background: rgba(0,100,200,.3); border-color: #4a9eff; }
  .cell.event { background: rgba(150,0,200,.3); border-color: #a855f7; }
  .cell.tax { background: rgba(200,50,0,.3); border-color: #ef4444; }
  .cell.bonus { background: rgba(0,180,100,.3); border-color: #22c55e; }
  .cell.finish { background: linear-gradient(135deg,rgba(212,175,55,.4),rgba(255,215,0,.3)); border-color: #ffd700; }
  .cell.current { box-shadow: 0 0 12px #d4af37; border-color: #d4af37 !important; }
  .cell-num { font-size: 9px; color: #9bb3d4; }
  .cell-icon { font-size: 1.4em; margin: 2px 0; }
  .cell-name { font-size: 9px; color: #e2e8f0; line-height: 1.2; }
  .cell-players { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 2px; }
  .token {
    width: 16px; height: 16px; border-radius: 50%; font-size: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.5);
  }

  /* ===== PLAYERS PANEL ===== */
  .players-panel {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
    gap: 8px; margin-top: 8px; max-width: 900px; margin-left: auto; margin-right: auto;
  }
  .player-card {
    background: rgba(26,58,107,.5); border: 2px solid #4a6fa5;
    border-radius: 10px; padding: 10px; transition: all .3s;
  }
  .player-card.active-player { border-color: #d4af37; background: rgba(212,175,55,.1); }
  .player-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .player-token-big { width: 32px; height: 32px; border-radius: 50%; font-size: 1.2em; display: flex; align-items: center; justify-content: center; }
  .player-name { font-weight: bold; font-size: 13px; }
  .player-turn-badge { background: #d4af37; color: #0a1628; font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
  .player-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 11px; }
  .stat { background: rgba(0,0,0,.2); border-radius: 6px; padding: 4px 8px; }
  .stat-label { color: #9bb3d4; font-size: 9px; }
  .stat-value { color: #d4af37; font-weight: bold; }
  .badges-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
  .badge { font-size: 0.85em; padding: 2px 6px; background: rgba(212,175,55,.2); border: 1px solid #d4af37; border-radius: 10px; color: #d4af37; font-size: 10px; }

  /* ===== DICE & CONTROLS ===== */
  .controls-area {
    max-width: 900px; margin: 8px auto; display: flex; gap: 10px;
    align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .dice-container { display: flex; gap: 10px; align-items: center; }
  .dice {
    width: 60px; height: 60px; background: linear-gradient(135deg,#d4af37,#b8860b);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 2em; color: #0a1628; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 15px rgba(212,175,55,.3); transition: transform .1s;
    user-select: none;
  }
  .dice.rolling { animation: rollDice .5s ease-in-out; }
  @keyframes rollDice {
    0%,100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-20deg) scale(1.1); }
    75% { transform: rotate(20deg) scale(1.1); }}
  .turn-info { background: rgba(0,0,0,.3); border: 1px solid #4a6fa5; border-radius: 8px; padding: 8px 15px; font-size: 13px; }
  .round-info { color: #9bb3d4; font-size: 12px; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 15px; display: none;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: linear-gradient(135deg,#0d2044,#1a3a6b);
    border: 2px solid #d4af37; border-radius: 16px;
    padding: 25px; max-width: 500px; width: 100%; max-height: 90vh;
    overflow-y: auto; position: relative;
  }
  .modal h2 { color: #d4af37; margin-bottom: 15px; font-size: 1.3em; }
  .modal-icon { font-size: 2.5em; text-align: center; margin-bottom: 10px; }
  .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #9bb3d4; font-size: 1.5em; cursor: pointer; }

  /* ===== QUESTION ===== */
  .question-text { font-size: 15px; line-height: 1.6; margin-bottom: 15px; color: #e2e8f0; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    background: rgba(255,255,255,.05); border: 2px solid #4a6fa5;
    border-radius: 8px; padding: 10px 15px; color: #fff; cursor: pointer;
    text-align: left; font-size: 13px; transition: all .2s;
  }
  .option-btn:hover:not(:disabled) { border-color: #d4af37; background: rgba(212,175,55,.1); }
  .option-btn.correct { background: rgba(34,197,94,.2); border-color: #22c55e; color: #86efac; }
  .option-btn.wrong { background: rgba(239,68,68,.2); border-color: #ef4444; color: #fca5a5; }
  .explanation {
    margin-top: 12px; padding: 10px; background: rgba(212,175,55,.1);
    border: 1px solid #d4af37; border-radius: 8px; font-size: 12px; color: #e2e8f0; line-height: 1.5;
  }

  /* ===== EVENT CARD ===== */
  .event-card-display {
    background: rgba(150,0,200,.1); border: 2px solid #a855f7;
    border-radius: 12px; padding: 20px; text-align: center;
  }
  .event-card-display .event-icon { font-size: 3em; margin-bottom: 10px; }
  .event-card-display .event-text { font-size: 15px; line-height: 1.6; }
  .event-result { font-size: 1.2em; font-weight: bold; margin-top: 10px; }
  .positive { color: #22c55e; }
  .negative { color: #ef4444; }

  /* ===== KNOWLEDGE BOOK ===== */
  .knowledge-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .knowledge-item {
    background: rgba(255,255,255,.05); border: 1px solid #4a6fa5;
    border-radius: 8px; padding: 10px;
  }
  .knowledge-item h4 { color: #d4af37; font-size: 12px; margin-bottom: 4px; }
  .knowledge-item p { color: #e2e8f0; font-size: 11px; line-height: 1.5; }
  .knowledge-empty { text-align: center; color: #9bb3d4; padding: 30px; }

  /* ===== END SCREEN ===== */
  #endScreen { max-width: 700px; margin: 0 auto; padding: 20px; }
  .end-title { font-size: 2em; color: #d4af37; text-align: center; margin-bottom: 5px; }
  .end-sub { text-align: center; color: #9bb3d4; margin-bottom: 25px; }
  .rankings { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .rank-card {
    background: rgba(255,255,255,.05); border: 2px solid #4a6fa5;
    border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 15px;
  }
  .rank-card.rank-1 { border-color: #ffd700; background: rgba(255,215,0,.1); }
  .rank-card.rank-2 { border-color: #c0c0c0; background: rgba(192,192,192,.1); }
  .rank-card.rank-3 { border-color: #cd7f32; background: rgba(205,127,50,.1); }
  .rank-num { font-size: 2em; min-width: 50px; text-align: center; }
  .rank-info { flex: 1; }
  .rank-name { font-size: 1.1em; font-weight: bold; }
  .rank-score { color: #d4af37; font-size: 1.3em; font-weight: bold; }
  .rank-details { font-size: 11px; color: #9bb3d4; margin-top: 3px; }
  .knowledge-summary {
    background: rgba(0,0,0,.3); border: 2px solid #d4af37;
    border-radius: 12px; padding: 15px; margin-bottom: 20px;
  }
  .knowledge-summary h3 { color: #d4af37; margin-bottom: 10px; }
  .knowledge-summary ul { list-style: none; }
  .knowledge-summary li { padding: 4px 0; font-size: 13px; color: #e2e8f0; }
  .knowledge-summary li::before { content: '🏛️ '; }

  /* ===== LOG ===== */
  .game-log {
    max-width: 900px; margin: 8px auto; background: rgba(0,0,0,.3);
    border: 1px solid #4a6fa5; border-radius: 8px; padding: 8px 12px;
    max-height: 60px; overflow-y: auto; font-size: 11px; color: #9bb3d4;
  }
  .log-entry { padding: 1px 0; }
  .log-entry.highlight { color: #d4af37; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .board { grid-template-columns: repeat(5,1fr); gap: 3px; }
    .cell { min-height: 55px; }
    .cell-icon { font-size: 1.1em; }
    .logo-title { font-size: 1.5em; }
    .players-panel { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- ===== SETUP SCREEN ===== -->
<div id="setupScreen" class="screen active">
  <div class="logo">🏛️</div>
  <div class="logo-title">เกมเศรษฐี: อารยธรรมกรีก</div>
  <div class="logo-sub">⚡ เดินทางสู่ดินแดนแห่งปัญญาและความรุ่งเรือง ⚡</div>

  <div class="setup-card">
    <h3>🎮 จำนวนผู้เล่น</h3>
    <div class="player-count-btns">
      <button class="count-btn" onclick="setPlayerCount(2)">2</button>
      <button class="count-btn" onclick="setPlayerCount(3)">3</button>
      <button class="count-btn" onclick="setPlayerCount(4)">4</button>
    </div>
  </div>

  <div class="setup-card">
    <h3>⚔️ ตั้งชื่อนักสำรวจ</h3>
    <div class="player-inputs" id="playerInputs"></div>
  </div>

  <button class="btn" onclick="startGame()" style="width:100%;padding:15px;font-size:1.1em;">
    🏛️ เริ่มการผจญภัย!
  </button>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="gameScreen" class="screen">
  <div class="game-header">
    <div class="game-title">🏛️ อารยธรรมกรีก</div>
    <div class="header-btns">
      <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="openKnowledgeBook()">📚 สมุดความรู้</button>
    </div>
  </div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="controls-area">
    <div class="turn-info" id="turnInfo">กำลังโหลด...</div>
    <div class="dice-container">
      <div class="dice" id="dice1">🎲</div>
      <div class="dice" id="dice2">🎲</div>
    </div>
    <button class="btn" id="rollBtn" onclick="rollDice()">🎲 ทอยลูกเต๋า</button>
    <div class="round-info" id="roundInfo">รอบที่ 1 / 30</div>
  </div>

  <div class="players-panel" id="playersPanel"></div>
  <div class="game-log" id="gameLog"></div>
</div>

<!-- ===== END SCREEN ===== -->
<div id="endScreen" class="screen">
  <div class="end-title">🏆 จบการผจญภัย!</div>
  <div class="end-sub">⚡ ผลการแข่งขันอารยธรรมกรีก ⚡</div>
  <div class="rankings" id="rankings"></div>
  <div class="knowledge-summary" id="knowledgeSummary"></div>
  <button class="btn" onclick="restartGame()" style="width:100%;padding:15px;font-size:1.1em;">🔄 เล่นใหม่</button>
</div>

<!-- ===== MODALS ===== -->
<div class="modal-overlay" id="questionModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('questionModal')">✕</button>
    <div class="modal-icon" id="qIcon">❓</div>
    <h2 id="qTitle">คำถามความรู้</h2>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="explanation" id="explanationText" style="display:none;"></div>
    <div style="text-align:center;margin-top:15px;">
      <button class="btn" id="qNextBtn" onclick="closeQuestionModal()" style="display:none;">ดำเนินการต่อ →</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <button class="modal-close" onclick="closeEventModal()">✕</button>
    <h2 class="gold">🎴 การ์ดเหตุการณ์</h2>
    <div class="event-card-display" id="eventCardDisplay"></div>
    <div style="text-align:center;margin-top:15px;">
      <button class="btn" onclick="closeEventModal()">ตกลง</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="knowledgeModal">
  <div class="modal" style="max-width:550px;">
    <button class="modal-close" onclick="closeModal('knowledgeModal')">✕</button>
    <h2>📚 สมุดบันทึกความรู้</h2>
    <p style="color:#9bb3d4;font-size:12px;margin-bottom:12px;">ความรู้ที่ได้รับระหว่างการผจญภัย</p>
    <div class="knowledge-list" id="knowledgeList"></div>
  </div>
</div>

<div class="modal-overlay" id="infoModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('infoModal')">✕</button>
    <div class="modal-icon" id="infoIcon">🏛️</div>
    <h2 id="infoTitle"></h2>
    <p id="infoText" style="color:#e2e8f0;line-height:1.7;font-size:14px;"></p>
    <div style="text-align:center;margin-top:15px;">
      <button class="btn" onclick="closeInfoModal()">ดำเนินการต่อ →</button>
    </div>
  </div>
</div>

<script>
// ===========================
// DATA: BOARD CELLS
// ===========================
const CELLS = [
  { name:'ประตูโอลิมปัส', icon:'🏛️', type:'start', desc:'จุดเริ่มต้นแห่งการผจญภัย ยินดีต้อนรับสู่ดินแดนกรีก!' },
  { name:'เอเธนส์', icon:'🦉', type:'question', desc:'นครรัฐแห่งปัญญาและประชาธิปไตย' },
  { name:'สปาร์ตา', icon:'⚔️', type:'question', desc:'นครรัฐนักรบผู้เข้มแข็ง' },
  { name:'เดลฟี', icon:'🔮', type:'event', desc:'ดินแดนแห่งคำพยากรณ์' },
  { name:'โอลิมเปีย', icon:'🏟️', type:'question', desc:'สถานที่จัดกีฬาโอลิมปิก' },
  { name:'วิหารพาร์เธนอน', icon:'🏯', type:'question', desc:'วิหารอันยิ่งใหญ่บนเนินอะโครโพลิส' },
  { name:'โสเครตีส', icon:'💭', type:'question', desc:'บิดาแห่งปรัชญากรีก' },
  { name:'เส้นทางการค้า', icon:'⚓', type:'bonus', desc:'เส้นทางการค้าทางทะเลอันรุ่งเรือง' },
  { name:'เพลโต', icon:'📖', type:'question', desc:'นักปรัชญาผู้ก่อตั้งสถาบันการศึกษา' },
  { name:'สงครามกรุงทรอย', icon:'🗡️', type:'event', desc:'สงครามอันโด่งดังในมหากาพย์อีเลียด' },
  { name:'อริสโตเติล', icon:'🔭', type:'question', desc:'นักปรัชญาผู้รู้รอบด้าน' },
  { name:'ภาษีแห่งนครรัฐ', icon:'💰', type:'tax', desc:'จ่ายภาษีเพื่อส่วนรวม' },
  { name:'พระเจ้าอเล็กซานเดอร์', icon:'👑', type:'question', desc:'กษัตริย์ผู้พิชิตโลก' },
  { name:'โรงละครกรีก', icon:'🎭', type:'question', desc:'ต้นกำเนิดของศิลปะการแสดง' },
  { name:'ความท้าทายเทพปกรณัม', icon:'⚡', type:'question', desc:'ทดสอบความรู้เรื่องเทพเจ้า' },
  { name:'หอประชาธิปไตย', icon:'🏛️', type:'question', desc:'ศูนย์กลางการปกครองของประชาชน' },
  { name:'ห้องสมุดแห่งปัญญา', icon:'📚', type:'bonus', desc:'รับความรู้และเหรียญ' },
  { name:'ความท้าทายปรัชญา', icon:'🤔', type:'question', desc:'ทดสอบความคิดเชิงปรัชญา' },
  { name:'สนามกีฬาโอลิมปิก', icon:'🏅', type:'question', desc:'แข่งขันเพื่อเกียรติยศ' },

  { icon:'🎖️', text:'ได้รับเลือกให้เป็นตัวแทนนครรัฐในการแข่งขันกีฬา!', coins:150, type:'positive' },
  { icon:'🍀', text:'พบสมบัติจากยุคโบราณขณะขุดดิน!', coins:400, type:'positive' },
  { icon:'🌋', text:'แผ่นดินไหวสร้างความเสียหายแก่ทรัพย์สิน', coins:-160, type:'negative' }
];

// ===========================
// DATA: BADGES
// ===========================
const BADGES = [
  { id:'philosopher', name:'นักปรัชญาแห่งกรีก', icon:'💭', condition: p => p.knowledgeScore >= 50 },
  { id:'democrat', name:'ผู้เชี่ยวชาญประชาธิปไตย', icon:'🏛️', condition: p => p.correctAnswers >= 5 },
  { id:'mythologist', name:'ผู้รู้เทพปกรณัม', icon:'⚡', condition: p => p.coins >= 1500 },
  { id:'architect', name:'สถาปนิกแห่งพาร์เธนอน', icon:'🏯', condition: p => p.totalTurns >= 10 },
  { id:'olympian', name:'แชมป์โอลิมปิก', icon:'🏅', condition: p => p.correctAnswers >= 10 },
  { id:'legend', name:'ตำนานอารยธรรมกรีก', icon:'👑', condition: p => p.knowledgeScore >= 100 }
];

// ===========================
// PLAYER AVATARS & COLORS
// ===========================
const AVATARS = ['🦁','🦅','🐉','⚡'];
const COLORS = ['#4a9eff','#ff6b6b','#22c55e','#a855f7'];
const BG_COLORS = ['rgba(74,158,255,0.3)','rgba(255,107,107,0.3)','rgba(34,197,94,0.3)','rgba(168,85,247,0.3)'];

// ===========================
// GAME STATE
// ===========================
let state = {
  players: [],
  currentPlayer: 0,
  round: 1,
  maxRounds: 30,
  gameOver: false,
  knowledgeBook: [],
  pendingAction: null // callback after modal close
};

// ===========================
// SETUP
// ===========================
let selectedCount = 2;

function setPlayerCount(n) {
  selectedCount = n;
  document.querySelectorAll('.count-btn').forEach((b,i) => b.classList.toggle('selected', i === n-2));
  renderPlayerInputs();
}

function renderPlayerInputs() {
  const defaults = ['อเล็กซานเดอร์','เพริคลีส','เอเธน่า','อาร์เทมิส'];
  document.getElementById('playerInputs').innerHTML = Array.from({length: selectedCount}, (_,i) => `
    <div class="player-input-row">
      <div class="player-avatar">${AVATARS[i]}</div>
      <input type="text" id="pname${i}" value="${defaults[i]}" placeholder="ชื่อผู้เล่น ${i+1}">
    </div>`).join('');
}

function startGame() {
  const names = Array.from({length: selectedCount}, (_,i) => {
    const v = document.getElementById(`pname${i}`)?.value.trim();
    return v || `ผู้เล่น ${i+1}`;
  });
  state.players = names.map((name, i) => ({
    name, avatar: AVATARS[i], color: COLORS[i], bg: BG_COLORS[i],
    coins: 500, knowledgeScore: 0, position: 0,
    correctAnswers: 0, wrongAnswers: 0, totalTurns: 0,
    badges: [], usedQuestions: new Set()
  }));
  state.currentPlayer = 0; state.round = 1; state.gameOver = false;
  state.knowledgeBook = [];
  showScreen('gameScreen');
  renderBoard(); renderPlayers(); updateTurnInfo();
  addLog(`🏛️ เริ่มการผจญภัยในดินแดนกรีกโบราณ!`, true);
}

// ===========================
// SCREEN MANAGEMENT
// ===========================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===========================
// BOARD RENDERING
// ===========================
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = CELLS.map((cell, i) => {
    const playersHere = state.players.filter(p => p.position === i);
    const isCurrentCell = state.players[state.currentPlayer]?.position === i;
    return `<div class="cell ${cell.type} ${isCurrentCell ? 'current' : ''}">
      <div class="cell-num">${i+1}</div>
      <div class="cell-icon">${cell.icon}</div>
      <div class="cell-name">${cell.name}</div>
      <div class="cell-players">${playersHere.map(p =>
        `<div class="token" style="background:${p.bg};border-color:${p.color}">${p.avatar}</div>`
      ).join('')}</div>
    </div>`;
  }).join('');
}

// ===========================
// PLAYER PANEL
// ===========================
function renderPlayers() {
  document.getElementById('playersPanel').innerHTML = state.players.map((p, i) => {
    const isActive = i === state.currentPlayer && !state.gameOver;
    return `<div class="player-card ${isActive ? 'active-player' : ''}">
      <div class="player-card-header">
        <div class="player-token-big" style="background:${p.bg};border:2px solid ${p.color}">${p.avatar}</div>
        <div>
          <div class="player-name" style="color:${p.color}">${p.name}</div>
          ${isActive ? '<div class="player-turn-badge">ตาของคุณ!</div>' : ''}
        </div>
      </div>
      <div class="player-stats">
        <div class="stat"><div class="stat-label">💰 เหรียญ</div><div class="stat-value">${p.coins}</div></div>
        <div class="stat"><div class="stat-label">📚 คะแนน</div><div class="stat-value">${p.knowledgeScore}</div></div>
        <div class="stat"><div class="stat-label">✅ ถูก</div><div class="stat-value">${p.correctAnswers}</div></div>
        <div class="stat"><div class="stat-label">❌ ผิด</div><div class="stat-value">${p.wrongAnswers}</div></div>
      </div>
      ${p.badges.length ? `<div class="badges-row">${p.badges.map(b => `<div class="badge" title="${b.name}">${b.icon}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function updateTurnInfo() {
  const p = state.players[state.currentPlayer];
  document.getElementById('turnInfo').innerHTML = `${p.avatar} <strong style="color:${p.color}">${p.name}</strong> กำลังเล่น`;
  document.getElementById('roundInfo').textContent = `รอบที่ ${state.round} / ${state.maxRounds}`;
}

// ===========================
// DICE
// ===========================
function rollDice() {
  if (state.gameOver) return;
  const btn = document.getElementById('rollBtn');
  btn.disabled = true;
  const d1 = document.getElementById('dice1');
  const d2 = document.getElementById('dice2');
  const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  d1.classList.add('rolling'); d2.classList.add('rolling');
  let count = 0;
  const iv = setInterval(() => {
    d1.textContent = faces[Math.floor(Math.random()*6)];
    d2.textContent = faces[Math.floor(Math.random()*6)];
    count++;
    if (count >= 8) {
      clearInterval(iv);
      d1.classList.remove('rolling'); d2.classList.remove('rolling');
      const r1 = Math.floor(Math.random()*6)+1;
      const r2 = Math.floor(Math.random()*6)+1;
      d1.textContent = faces[r1-1]; d2.textContent = faces[r2-1];
      movePlayer(r1+r2);
    }
  }, 80);
}

// ===========================
// MOVEMENT
// ===========================
function movePlayer(steps) {
  const p = state.players[state.currentPlayer];
  p.totalTurns++;
  const newPos = Math.min(p.position + steps, CELLS.length - 1);
  const passedFinish = newPos >= CELLS.length - 1 && p.position < CELLS.length - 1;
  p.position = newPos;
  addLog(`${p.avatar} ${p.name} เดิน ${steps} ช่อง → ${CELLS[newPos].name}`, false);
  renderBoard(); renderPlayers();
  checkBadges(state.currentPlayer);
  if (passedFinish || p.position === CELLS.length - 1) {
    renderBoard();
    setTimeout(() => endGame(`${p.name} ถึงช่องเกียรติยศสูงสุด!`), 500);
    return;
  }
  setTimeout(() => handleCell(state.currentPlayer), 400);
}

// ===========================
// CELL HANDLING
// ===========================
function handleCell(pi) {
  const p = state.players[pi];
  const cell = CELLS[p.position];
  if (cell.type === 'question') {
    showQuestion(pi);
  } else if (cell.type === 'event') {
    showEventCard(pi);
  } else if (cell.type === 'tax') {
    const tax = Math.floor(p.coins * 0.1) + 100;
    p.coins = Math.max(0, p.coins - tax);
    addLog(`💰 ${p.name} จ่ายภาษี ${tax} เหรียญ`, false);
    showInfo('💰 ภาษีแห่งนครรัฐ', `${cell.icon} ${cell.desc}`, `คุณจ่ายภาษี ${tax} เหรียญ\nเหลือ ${p.coins} เหรียญ`, () => nextTurn());
  } else if (cell.type === 'bonus') {
    const bonus = 200;
    p.coins += bonus; p.knowledgeScore += 15;
    addLog(`📚 ${p.name} รับโบนัส ${bonus} เหรียญ`, true);
    showInfo('📚 โบนัสพิเศษ', `${cell.icon} ${cell.name}`, `ยอดเยี่ยม! คุณได้รับ ${bonus} เหรียญ และ 15 คะแนนความรู้\n${cell.desc}`, () => nextTurn());
  } else {
    showInfo(cell.name, `${cell.icon} ${cell.name}`, cell.desc, () => nextTurn());
  }
}

// ===========================
// QUESTIONS
// ===========================
function showQuestion(pi) {
  const p = state.players[pi];
  // สุ่มคำถามที่ยังไม่เคยถาม
  const available = QUESTIONS.filter((_,i) => !p.usedQuestions.has(i));
  const pool = available.length > 0 ? available : QUESTIONS;
  const qi = QUESTIONS.indexOf(pool[Math.floor(Math.random()*pool.length)]);
  p.usedQuestions.add(qi);
  const q = QUESTIONS[qi];

  document.getElementById('qIcon').textContent = '❓';
  document.getElementById('qTitle').textContent = `คำถาม: ${q.topic}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('explanationText').style.display = 'none';
  document.getElementById('qNextBtn').style.display = 'none';

  const opts = ['ก','ข','ค','ง'];
  document.getElementById('optionsContainer').innerHTML = q.opts.map((opt,i) =>
    `<button class="option-btn" onclick="answerQuestion(${pi},${qi},${i})">${opts[i]}. ${opt}</button>`
  ).join('');

  openModal('questionModal');
}

function answerQuestion(pi, qi, chosen) {
  const p = state.players[pi];
  const q = QUESTIONS[qi];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  btns[q.ans].classList.add('correct');

  if (chosen === q.ans) {
    p.coins += 200; p.knowledgeScore += 10; p.correctAnswers++;
    addLog(`✅ ${p.name} ตอบถูก! +200 เหรียญ +10 คะแนน`, true);
    document.getElementById('qIcon').textContent = '✅';} else {
    btns[chosen].classList.add('wrong');
    p.coins = Math.max(0, p.coins - 100); p.wrongAnswers++;
    addLog(`❌ ${p.name} ตอบผิด -100 เหรียญ`, false);
    document.getElementById('qIcon').textContent = '❌';
  }
  // บันทึกลงสมุดความรู้
  const already = state.knowledgeBook.find(k => k.q === q.q);
  if (!already) state.knowledgeBook.push({ q: q.q, ans: q.opts[q.ans], exp: q.exp, topic: q.topic });

  document.getElementById('explanationText').textContent = `💡 ${q.exp}`;
  document.getElementById('explanationText').style.display = 'block';
  document.getElementById('qNextBtn').style.display = 'inline-block';
  renderPlayers(); checkBadges(pi);
}

function closeQuestionModal() {
  closeModal('questionModal');
  nextTurn();
}

// ===========================
// EVENT CARDS
// ===========================
function showEventCard(pi) {
  const p = state.players[pi];
  const ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  p.coins = Math.max(0, p.coins + ev.coins);
  if (ev.knowledgeBonus) p.knowledgeScore += ev.knowledgeBonus;

  const sign = ev.coins >= 0 ? '+' : '';
  document.getElementById('eventCardDisplay').innerHTML = `
    <div class="event-icon">${ev.icon}</div>
    <div class="event-text">${ev.text}</div>
    <div class="event-result ${ev.type}">${sign}${ev.coins} เหรียญ${ev.knowledgeBonus ? ` +${ev.knowledgeBonus} คะแนน` : ''}</div>`;

  addLog(`🎴 ${p.name}: ${ev.text.slice(0,30)}... (${sign}${ev.coins})`, ev.type === 'positive');
  renderPlayers(); checkBadges(pi);
  state.pendingAction = () => nextTurn();
  openModal('eventModal');
}

function closeEventModal() {
  closeModal('eventModal');
  if (state.pendingAction) { state.pendingAction(); state.pendingAction = null; }
}

// ===========================
// INFO MODAL
// ===========================
function showInfo(title, icon, text, callback) {
  document.getElementById('infoIcon').textContent = icon.split(' ')[0];
  document.getElementById('infoTitle').textContent = title;
  document.getElementById('infoText').textContent = text;
  state.pendingAction = callback;
  openModal('infoModal');
}

function closeInfoModal() {
  closeModal('infoModal');
  if (state.pendingAction) { state.pendingAction(); state.pendingAction = null; }
}

// ===========================
// MODAL HELPERS
// ===========================
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ===========================
// KNOWLEDGE BOOK
// ===========================
function openKnowledgeBook() {
  const list = document.getElementById('knowledgeList');
  if (state.knowledgeBook.length === 0) {
    list.innerHTML = '<div class="knowledge-empty">📚 ยังไม่มีความรู้ที่บันทึก<br>ตอบคำถามเพื่อเพิ่มความรู้!</div>';
  } else {
    list.innerHTML = state.knowledgeBook.map(k => `
      <div class="knowledge-item">
        <h4>[${k.topic}] ${k.q}</h4>
        <p>✅ คำตอบ: <strong>${k.ans}</strong></p>
        <p>💡 ${k.exp}</p>
      </div>`).join('');
  }
  openModal('knowledgeModal');
}

// ===========================
// BADGES CHECK
// ===========================
function checkBadges(pi) {
  const p = state.players[pi];
  BADGES.forEach(badge => {
    if (!p.badges.find(b => b.id === badge.id) && badge.condition(p)) {
      p.badges.push(badge);
      addLog(`🏆 ${p.name} ปลดล็อก: ${badge.icon} ${badge.name}!`, true);
    }
  });
}

// ===========================
// TURN MANAGEMENT
// ===========================
function nextTurn() {
  if (state.gameOver) return;
  state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
  if (state.currentPlayer === 0) {
    state.round++;
    if (state.round > state.maxRounds) { endGame('ครบ 30 รอบ!'); return; }
  }
  renderBoard(); renderPlayers(); updateTurnInfo();
  document.getElementById('rollBtn').disabled = false;
  addLog(`--- รอบที่ ${state.round} - ${state.players[state.currentPlayer].name}'s turn ---`, false);
}

// ===========================
// GAME LOG
// ===========================
function addLog(text, highlight = false) {
  const log = document.getElementById('gameLog');
  const div = document.createElement('div');
  div.className = `log-entry${highlight ? ' highlight' : ''}`;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ===========================
// END GAME
// ===========================
function endGame(reason) {
  state.gameOver = true;
  document.getElementById('rollBtn').disabled = true;
  addLog(`🏁 เกมจบ: ${reason}`, true);

  // คำนวณคะแนนสุดท้าย
  const sorted = [...state.players].map(p => ({
    ...p,
    totalScore: p.coins + (p.knowledgeScore * 10) + (p.badges.length * 200)
  })).sort((a,b) => b.totalScore - a.totalScore);

  const medals = ['🥇','🥈','🥉','🏅'];
  document.getElementById('rankings').innerHTML = sorted.map((p,i) => `
    <div class="rank-card rank-${i+1}">
      <div class="rank-num">${medals[i]}</div>
      <div style="font-size:2em">${p.avatar}</div>
      <div class="rank-info">
        <div class="rank-name" style="color:${p.color}">${p.name}</div>
        <div class="rank-score">${p.totalScore.toLocaleString()} คะแนนรวม</div>
        <div class="rank-details">
          💰 ${p.coins} เหรียญ | 📚 ${p.knowledgeScore} คะแนนความรู้<br>
          ✅ ถูก ${p.correctAnswers} ข้อ | ❌ ผิด ${p.wrongAnswers} ข้อ<br>
          🏆 ${p.badges.map(b => b.icon+b.name).join(', ') || 'ยังไม่มีเหรียญรางวัล'}
        </div>
      </div>
    </div>`).join('');

  document.getElementById('knowledgeSummary').innerHTML = `
    <h3>📚 สรุปความรู้สำคัญเกี่ยวกับอารยธรรมกรีก</h3>
    <ul>
      <li>เอเธนส์เป็นต้นกำเนิดของระบอบประชาธิปไตย ประชาชนมีสิทธิ์ออกเสียง</li>
      <li>สปาร์ตาเน้นการฝึกทหาร เด็กเริ่มฝึกตั้งแต่อายุ 7 ขวบ</li>
      <li>โสเครตีส เพลโต อริสโตเติล เป็นสามเสาหลักปรัชญากรีก</li>
      <li>กีฬาโอลิมปิกโบราณจัดครั้งแรก 776 ปีก่อนคริสต์กาลที่โอลิมเปีย</li>
      <li>วิหารพาร์เธนอนสร้างถวายเทพีเอเธน่า บนเนินอะโครโพลิส</li>
      <li>อเล็กซานเดอร์มหาราชแผ่อาณาจักรจากกรีกถึงอินเดีย</li>
      <li>อิทธิพลกรีกยังคงอยู่ในระบบประชาธิปไตย ปรัชญา คณิตศาสตร์ และการแพทย์สมัยใหม่</li>
    </ul>`;

  showScreen('endScreen');
}

function restartGame() {
  showScreen('setupScreen');
  document.getElementById('dice1').textContent = '🎲';
  document.getElementById('dice2').textContent = '🎲';
}

// ===========================
// INIT
// ===========================
setPlayerCount(2);
</script>
</body>
</html>
