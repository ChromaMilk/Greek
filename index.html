<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioN-Cell: Interactive Mockup</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* ส่วนควบคุมแถบเลื่อน (Sliders) */
        .controls-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        /* ส่วนแสดงผลข้อมูล (Cards) */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; border-top: 4px solid #bdc3c7; }
        .card.gas { border-color: #3498db; }
        .card.ammonia { border-color: #e74c3c; }
        .card.tds { border-color: #f39c12; }
        .card.efficiency { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; border: none; }
        
        .card h3 { margin: 0 0 10px 0; font-size: 15px; color: inherit; }
        .card.efficiency h3 { color: white; }
        .card .value { font-size: 28px; font-weight: bold; }
        .card.gas .value { color: #3498db; }
        .card.ammonia .value { color: #e74c3c; }
        .card.tds .value { color: #f39c12; }
        .card.efficiency .value { color: white; }
        .card .unit { font-size: 13px; color: #7f8c8d; }
        .card.efficiency .unit { color: #ecf0f1; }

        /* ส่วนกราฟ */
        .chart-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="header">
        <h1>BioN-Cell Dashboard (Interactive Mode)</h1>
        <p>เลื่อนแถบด้านล่างเพื่อจำลองการเปลี่ยนแปลงค่าเซนเซอร์</p>
    </div>

    <div class="controls-container">
        <div class="control-group">
            <label>ปรับปริมาตรก๊าซ N2/H2 (0 - 100 mL)</label>
            <input type="range" id="gasSlider" min="0" max="100" step="0.5" value="10">
        </div>
        <div class="control-group">
            <label>ปรับความเข้มข้นแอมโมเนีย (0 - 50 mg/L) *เริ่มต้นที่ 50</label>
            <input type="range" id="ammoniaSlider" min="0" max="50" step="0.5" value="45">
        </div>
        <div class="control-group">
            <label>ปรับค่าความนำไฟฟ้า TDS (0 - 2000 µS/cm)</label>
            <input type="range" id="tdsSlider" min="0" max="2000" step="10" value="1200">
        </div>
    </div>

    <div class="grid-container">
        <div class="card gas">
            <h3>ปริมาตรก๊าซสะสม</h3>
            <div class="value" id="gasValue">10.0</div>
            <div class="unit">mL</div>
        </div>
        <div class="card ammonia">
            <h3>ความเข้มข้นแอมโมเนีย</h3>
            <div class="value" id="ammoniaValue">45.0</div>
            <div class="unit">mg/L</div>
        </div>
        <div class="card tds">
            <h3>ความนำไฟฟ้า (TDS)</h3>
            <div class="value" id="tdsValue">1200</div>
            <div class="unit">µS/cm</div>
        </div>
        <div class="card efficiency">
            <h3>ประสิทธิภาพ Biochar</h3>
            <div class="value" id="efficiencyValue">10.0</div>
            <div class="unit">%</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="sensorChart"></canvas>
    </div>

    <script>
        // กำหนดค่าเริ่มต้นของแอมโมเนียสำหรับใช้คำนวณประสิทธิภาพ
        const initialAmmonia = 50.0;

        // อ้างอิง Elements จาก HTML
        const gasSlider = document.getElementById('gasSlider');
        const ammoniaSlider = document.getElementById('ammoniaSlider');
        const tdsSlider = document.getElementById('tdsSlider');
        
        const gasDisplay = document.getElementById('gasValue');
        const ammoniaDisplay = document.getElementById('ammoniaValue');
        const tdsDisplay = document.getElementById('tdsValue');
        const efficiencyDisplay = document.getElementById('efficiencyValue');

        // ตั้งค่ากราฟ Chart.js
        const ctx = document.getElementById('sensorChart').getContext('2d');
        const sensorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Start'], 
                datasets: [
                    {
                        label: 'ปริมาตรก๊าซ (mL)',
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        data: [10],
                        yAxisID: 'y',
                        tension: 0.4
                    },
                    {
                        label: 'แอมโมเนีย (mg/L)',
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.2)',
                        data: [45],
                        yAxisID: 'y1',
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { 
                        type: 'linear', display: true, position: 'left', 
                        title: { display: true, text: 'Gas Volume (mL)' },
                        suggestedMin: 0, suggestedMax: 100
                    },
                    y1: { 
                        type: 'linear', display: true, position: 'right', 
                        title: { display: true, text: 'Ammonia (mg/L)' }, 
                        grid: { drawOnChartArea: false },
                        suggestedMin: 0, suggestedMax: 50
                    }
                }
            }
        });

        // ฟังก์ชันอัปเดตข้อมูลทั้งหมดเมื่อมีการเลื่อน Slider
        function updateDashboard() {
            // 1. ดึงค่าจาก Sliders
            let currentGas = parseFloat(gasSlider.value);
            let currentAmmonia = parseFloat(ammoniaSlider.value);
            let currentTDS = parseInt(tdsSlider.value);

            // 2. คำนวณประสิทธิภาพ (Efficiency) = (C0 - Ct) / C0 * 100
            let efficiency = ((initialAmmonia - currentAmmonia) / initialAmmonia) * 100;

            // 3. แสดงผลตัวเลขบนการ์ด
            gasDisplay.innerText = currentGas.toFixed(1);
            ammoniaDisplay.innerText = currentAmmonia.toFixed(1);
            tdsDisplay.innerText = currentTDS;
            efficiencyDisplay.innerText = efficiency.toFixed(1);

            // 4. อัปเดตกราฟ (เพิ่มข้อมูลใหม่ต่อท้าย และตัดข้อมูลเก่าออกถ้ายาวเกินไป)
            const now = new Date();
            const timeString = String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
            
            // จำกัดจำนวนจุดบนกราฟไม่ให้เกิน 20 จุด
            if (sensorChart.data.labels.length > 20) {
                sensorChart.data.labels.shift();
                sensorChart.data.datasets[0].data.shift();
                sensorChart.data.datasets[1].data.shift();
            }
            
            sensorChart.data.labels.push(timeString);
            sensorChart.data.datasets[0].data.push(currentGas);
            sensorChart.data.datasets[1].data.push(currentAmmonia);
            sensorChart.update();
        }

        // ดักจับเหตุการณ์ (Event Listeners) เมื่อผู้ใช้เลื่อนแถบ
        gasSlider.addEventListener('input', updateDashboard);
        ammoniaSlider.addEventListener('input', updateDashboard);
        tdsSlider.addEventListener('input', updateDashboard);

    </script>
</body>
</html>
